[project]
name = "amplifier-module-tool-remote-task"
version = "0.1.0"
description = "Amplifier tool module for delegating tasks to remote agents via SSH"
requires-python = ">=3.11"
dependencies = [
    "paramiko>=3.0.0",
]

[project.entry-points."amplifier.modules"]
tool-remote-task = "amplifier_module_tool_remote_task:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_remote_task"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "amplifier-core @ git+https://github.com/microsoft/amplifier-core@main",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires localhost SSH to be configured",
]
